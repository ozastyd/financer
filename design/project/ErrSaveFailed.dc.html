<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Gagal menyimpan transaksi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="fo" data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--scrim)">
<div style="height: 56px; flex: none"></div>
<div role="dialog" aria-label="Input manual" style="flex: 1; background: var(--bg); border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 40px; height: 4px; border-radius: 99px; background: var(--ctl); align-self: center"></div>
<div class="row">
<h1 class="h2 sp">Input manual</h1>
<a class="ibtn" href="Home.dc.html" aria-label="Tutup" style="border-radius: 50%"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</div>

<div class="toast err" role="alert">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
<span class="sp">Gagal menyimpan. Periksa koneksimu lalu coba lagi.</span>
<button class="x" type="button" aria-label="Tutup pesan"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<div class="seg" role="group" aria-label="Jenis transaksi">
<button class="on" type="button" aria-pressed="true">Pengeluaran</button>
<button type="button" aria-pressed="false">Pemasukan</button>
</div>

<div class="col" style="align-items: center; gap: 2px">
<p class="s mut">Jumlah</p>
<p class="big" style="font-size: 40px">Rp35.000</p>
</div>

<div class="col" style="gap: 8px">
<p class="sec">Kategori</p>
<div class="wrap">
<button class="chip on" type="button" aria-pressed="true"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Makan</button>
<button class="chip" type="button" aria-pressed="false">Transport</button>
<button class="chip" type="button" aria-pressed="false">Belanja</button>
<button class="chip" type="button" aria-pressed="false">Lainnya</button>
</div>
</div>

<div class="row" style="gap: 8px">
<button class="chip" type="button" style="border-radius: 14px; flex: none"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v15H4zM4 10h16M8 3v4M16 3v4"/></svg>Hari ini</button>
<input class="inp" type="text" aria-label="Catatan (opsional)" value="Kopi susu" style="height: 44px; font-size: 15px">
</div>

<div class="sp"></div>
<p class="s mut" style="text-align: center">Isianmu tetap di sini, tidak perlu mengetik ulang.</p>
<button class="btn" type="button" style="border-radius: 999px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Coba simpan lagi</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
