<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Atur ritme nabung</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="fo" data-theme="{{theme}}" style="width: 390px; height: 844px; background: var(--scrim)">
<div style="flex: 1; min-height: 56px"></div>
<div role="dialog" aria-label="Atur ritme nabung" style="flex: none; background: var(--bg); border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 12px">
<div style="width: 40px; height: 4px; border-radius: 99px; background: var(--ctl); align-self: center"></div>

<div class="row">
<div class="col sp" style="gap: 0">
<h1 class="h2">Ritme nabung</h1>
<p class="s mut">Rp10 Juta Pertamaku · sisa Rp5.750.000</p>
</div>
<a class="ibtn" href="GoalDetail.dc.html" aria-label="Tutup" style="border-radius: 50%"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</div>

<button class="tile" type="button" aria-pressed="false" style="min-height: 72px; justify-content: space-between">
<span class="col" style="gap: 0"><span class="h3 num">Rp825.000 / bulan</span><span class="s mut" style="font-weight: 500">7 bulan · selesai Juni 2027</span></span>
<span class="tag">Tepat waktu</span>
</button>
<button class="tile on" type="button" aria-pressed="true" style="min-height: 72px; justify-content: space-between">
<span class="col" style="gap: 0"><span class="h3 num">Rp700.000 / bulan</span><span class="s" style="font-weight: 500">9 bulan · selesai Agustus 2027</span></span>
<span class="tag" style="background: var(--sf)"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Sekarang</span>
</button>
<button class="tile" type="button" aria-pressed="false" style="min-height: 72px; justify-content: space-between">
<span class="col" style="gap: 0"><span class="h3 num">Rp600.000 / bulan</span><span class="s mut" style="font-weight: 500">10 bulan · selesai September 2027</span></span>
<span class="tag neu">Lebih ringan</span>
</button>

<div>
<label class="lbl" for="lain">Atau tulis jumlah sendiri</label>
<input class="inp" id="lain" type="text" inputmode="numeric" placeholder="Rp per bulan">
</div>

<p class="s mut">Telat itu nggak apa-apa. Perkiraan dibulatkan ke bulan penuh dan belum termasuk bunga tabungan.</p>
<button class="btn" type="button" style="border-radius: 999px">Pakai ritme ini</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
