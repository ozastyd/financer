<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tambah transaksi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./fo.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="fo" data-theme="{{theme}}" style="width: 390px; height: 880px; background: var(--scrim)">
<div style="height: 56px; flex: none"></div>
<div role="dialog" aria-label="Tambah transaksi" style="flex: 1; background: var(--bg); border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 40px; height: 4px; border-radius: 99px; background: var(--ctl); align-self: center"></div>

<div class="row">
<h1 class="h2 sp">Input manual</h1>
<a class="ibtn" href="Home.dc.html" aria-label="Tutup" style="border-radius: 50%"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</div>

<div class="seg" role="group" aria-label="Jenis transaksi">
<button class="on" type="button" aria-pressed="true">Pengeluaran</button>
<button type="button" aria-pressed="false">Pemasukan</button>
</div>

<div class="col" style="align-items: center; gap: 2px; padding: 6px 0">
<p class="s mut">Jumlah</p>
<p class="big" style="font-size: 40px">Rp35.000</p>
</div>

<div class="col" style="gap: 8px">
<p class="sec">Kategori</p>
<div class="wrap">
<button class="chip on" type="button" aria-pressed="true"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Makan</button>
<button class="chip" type="button" aria-pressed="false">Transport</button>
<button class="chip" type="button" aria-pressed="false">Belanja</button>
<button class="chip" type="button" aria-pressed="false">Hiburan</button>
<button class="chip" type="button" aria-pressed="false">Langganan</button>
<button class="chip" type="button" aria-pressed="false">Lainnya</button>
</div>
</div>

<div class="row" style="gap: 8px">
<button class="chip" type="button" style="border-radius: 14px; flex: none"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v15H4zM4 10h16M8 3v4M16 3v4"/></svg>Hari ini</button>
<input class="inp" type="text" aria-label="Catatan (opsional)" placeholder="Catatan (opsional)" value="Kopi susu" style="height: 44px; font-size: 15px">
</div>

<div class="g3" aria-label="Papan angka">
<button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
<button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
<button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
<button class="key" type="button">000</button><button class="key" type="button">0</button><button class="key" type="button" aria-label="Hapus angka"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11v14H9l-6-7zM13 10l4 4M17 10l-4 4"/></svg></button>
</div>

<div class="sp"></div>
<button class="btn" type="button">Simpan</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
